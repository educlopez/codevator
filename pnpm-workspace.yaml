  flatted: ">=3.4.2"
  minimatch: ">=3.1.4"
  "rollup@>=4.0.0 <4.59.0": "4.59.0"
  "ajv@<6.14.0": "6.14.0"
  "lodash@>=4.0.0 <4.18.0": "4.18.0"
  "basic-ftp@<5.3.1": "5.3.1"
  "ip-address@>=10.0.0 <10.7.1": "10.7.4"
  "picomatch@<2.3.2": "2.3.2"
  "picomatch@>=4.0.0 <4.0.4": "4.0.4"
  "vite@>=7.0.0 <7.3.7": "7.3.7"
  "handlebars@>=4.0.0 <4.7.10": "4.7.10"
  "brace-expansion@>=1.0.0 <1.1.21": "1.1.21"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "postcss@>=8.0.0 <8.5.23": "8.5.31"
  "nanoid@>=3.0.0 <3.3.18": "3.3.20"
  "browserslist@>=4.0.0 <4.28.7": "4.29.4"
